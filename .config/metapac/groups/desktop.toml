arch = {
  packages = [
    # X server
    "xorg-server",
    "xorg-xinit",
    "xorg-xev",

    # display manager
    "ly",

    # window manager
    "bspwm",
    "sxhkd",

    # terminal + compositor
    "kitty",
    "picom",

    # bar / launcher / notifications
    "polybar",
    "rofi",
    "rofi-emoji",
    "dmenu",
    "dunst",

    # desktop utilities
    "feh",
    "autorandr",
    "arandr",
    "xorg-xrandr",
    "xorg-xsetroot",
    "xidlehook",
    "xss-lock",
    "xdo",
    "i3lock-color",
    "fuse2",  # needed for some AppImages

    # audio (pipewire stack)
    "pipewire",
    "pipewire-alsa",
    "pipewire-pulse",
    "pipewire-jack",
    "wireplumber",
    "libpulse",
    "gst-plugin-pipewire",

    # bluetooth
    "bluez",
    "bluez-utils",

    # MTP (phone file transfer)
    "gvfs-mtp",
    "jmtpfs",

    # printing (CUPS + broad driver coverage)
    "cups",
    "cups-filters",
    "cups-pdf",
    "ghostscript",
    "gsfonts",
    "gutenprint",
    "foomatic-db-engine",
    "foomatic-db",
    "foomatic-db-ppds",
    "foomatic-db-nonfree",
    "foomatic-db-nonfree-ppds",
    "splix", # Samsung SPL2/SPL-C printers
    "avahi", # mDNS discovery for network/AirPrint printers
    "nss-mdns",
    "ijs",
    "jbig2dec",
    "libcupsfilters",
    "libpaper",
    "libppd",
    "pdfio",
    "poppler",
    "poppler-data",
    "libidn",
    "gpgmepp",
    "perl-alien-build",
    "perl-alien-libxml2",
    "perl-capture-tiny",
    "perl-clone",
    "perl-dbi",
    "perl-ffi-checklib",
    "perl-file-chdir",
    "perl-file-which",
    "perl-path-tiny",
    "perl-xml-libxml",
    "perl-xml-namespacesupport",
    "perl-xml-sax",
    "perl-xml-sax-base",

    # fonts
    "noto-fonts-emoji",
    "inter-font",
    "ttf-ibm-plex",

    # editor + terminal tools
    "neovim",
    "starship",
    "fzf",
    "fd",
    "ripgrep",
    "bat",
    "git-delta",
    "jq",
    "jc",
    "inotify-tools",

    # apps
    "firefox",
    "chromium",
    "nemo",
    "nemo-fileroller",
    "yazi",
    "maim",
    "swappy",
    "tty-clock",
    "pulsemixer",
    "vlc",
    "vlc-plugin-ffmpeg",
    "signal-desktop",
    "bluetuith",
    "flatpak",
    "kchat-appimage",

    # themes
    "dracula-icons-theme",
  ]
