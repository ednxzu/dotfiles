#:schema https://mise.jdx.dev/schema/mise.json
[tools]
"pipx:copier" = "latest"
"pipx:reno" = "latest"
"pipx:git+https://github.com/ednxzu/git-nearit.git" = "latest"
"pipx:ansible-core" = { version = "latest", uvx_args = "--with ansible-lint" }
"pipx:python-openstackclient" = {
  version = "latest",
  uvx_args = """\
    --with osc-placement \
    --with python-barbicanclient \
    --with python-ceilometerclient \
    --with python-cinderclient \
    --with python-cloudkittyclient \
    --with python-cyborgclient \
    --with python-designateclient \
    --with python-glanceclient \
    --with python-heatclient \
    --with python-ironicclient \
    --with python-keystoneclient \
    --with python-magnumclient \
    --with python-manilaclient \
    --with python-masakariclient \
    --with python-mistralclient \
    --with python-neutronclient \
    --with python-novaclient \
    --with python-octaviaclient \
    --with python-swiftclient \
    --with python-troveclient \
    --with python-zunclient \
    --with openstacksdk \
    --with aodhclient \
    --with gnureadline"""
}

[bootstrap.packages]
"aur:claude-code" = "latest"
"aur:devpod-bin" = "latest"
"aur:gitflow-avh" = "latest"
"pacman:cyme" = "latest"
"pacman:fio" = "latest"
"pacman:ghq" = "latest"
"pacman:go" = "latest"
"pacman:go-yq" = "latest"
"pacman:npm" = "latest"
"pacman:podman" = "latest"
"pacman:podman-compose" = "latest"
"pacman:pre-commit" = "latest"
"pacman:python" = "latest"
"pacman:python-json5" = "latest"
"pacman:python-pip" = "latest"
"pacman:python-poetry" = "latest"
"pacman:python-tox" = "latest"
"pacman:python-yaml" = "latest"
"pacman:rclone" = "latest"
"pacman:rustup" = "latest"
"pacman:tk" = "latest"
"pacman:uv" = "latest"
"pacman:slumber" = "latest"

[bootstrap.hooks.post-packages]
run = [
  "devpod-cli completion bash >~/.bash_config.d/completion.d/devpod",
  "poetry completions bash > ~/.bash_config.d/completion.d/poetry",
  "uv generate-shell-completion bash > ~/.bash_config.d/completion.d/uv",
  "rclone completion bash - > ~/.bash_config.d/completion.d/rclone",
  "echo \"source <(COMPLETE=bash slumber)\" >> ~/.bash_config.d/completion.d/slumber"
]

[bootstrap.hooks.post-tools]
run = [
  "openstack complete > ~/.bash_config.d/completion.d/openstack 2>/dev/null",
]
