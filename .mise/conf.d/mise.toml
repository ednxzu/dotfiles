[bootstrap.services."pcscd.socket"]
state = "running"
enabled = true

[bootstrap.services.NetworkManager]
state = "running"
enabled = true

[bootstrap.linux.systemd.units.dotfiles-sync]
description = "Sync dotfiles repository and apply changes"
type = "oneshot"
exec_start = "/bin/bash -c '[[ -x \"$HOME/.config/dotfiles/dotfiles-sync.sh\" ]] && \"$HOME/.config/dotfiles/dotfiles-sync.sh\"'"
standard_output = "journal"
standard_error = "journal"
remain_after_exit = true
# Do NOT start, otherwise, really bad recursion
start = false
