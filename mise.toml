#:schema https://mise.jdx.dev/schema/mise.json
[dotfiles]
"~/.agents" = { source = ".agents", mode = "symlink-each", manifest = "git" }
"~/.claude/skills" = { source = ".agents/skills", mode = "symlink-each", manifest = "git" }
"~/.config" = { source = ".config", mode = "symlink-each", manifest = "git" }
"~/.bash_config.d" = { mode = "symlink" }
"~/.bash_logout" = { mode = "symlink" }
"~/.bashrc" = { mode = "symlink" }
"~/.fonts" = { mode = "symlink" }
"~/.gitconfig" = { mode = "symlink" }
"~/.gitconfig.d" = { mode = "symlink" }
"~/.gnupg" = { source = ".gnupg", mode = "symlink-each", manifest = "git" }
"~/.local" = { source = ".local", mode = "symlink-each", manifest = "git" }
"~/.themes" = { mode = "symlink" }
"~/.vimrc" = { mode = "symlink" }
"~/.xinitrc" = { mode = "symlink" }
"~/.Xresources" = { mode = "symlink" }

[tasks."rtk:setup"]
description = "Install the rtk OpenCode plugin (rerun after rtk upgrades)"
# rtk.ts is embedded in the rtk binary and versioned with it, so it is
# generated rather than tracked. --no-patch leaves ~/.claude/settings.json
# alone: the Claude Bash hook never fires under OpenChamber.
run = "rtk init -g --opencode --hook-only --no-patch"

[bootstrap.groups.lanson]
system = true

[bootstrap.users.lanson]
system = true
group = "lanson"
home = "/home/lanson"
shell = "/usr/bin/bash"
comment = "Bertrand Lanson"
create_home = true
move_home = true

[bootstrap.files."/etc/sudoers.d/lanson"]
source = "./bootstrap.d/sudoers.d/lanson"
owner = "root"
group = "root"
mode = "0660"
